name: Refresh activity chart

on:
  schedule:
    - cron: "15 10 * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_activity.py ${{ github.repository_owner }} .
      - name: Commit if changed
        run: |
          git config user.name "Ton-Llop"
          git config user.email "tonichi003@gmail.com"
          git add activity-light.svg activity-dark.svg
          git diff --staged --quiet || git commit -m "chore: refresh activity chart"
          git push
